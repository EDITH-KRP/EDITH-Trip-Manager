services:
  - type: web
    name: edith-trip-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: ADMIN_NAME
        value: Prajwal
      - key: ADMIN_EMAIL
        value: prajwal@edith.travel
      - key: ADMIN_PASSWORD
        value: Prajwal784

